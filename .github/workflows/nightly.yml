name: Deep perft

# 760M nodes, about 75 seconds locally. Too slow for every push, so it runs
# nightly and on demand.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  deep:
    name: perft depth 6+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew perftDeep
